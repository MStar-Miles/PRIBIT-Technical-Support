# controller/nginx.conf
user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }

# TCP 프록시(제어 흐름) — 필요 시 backend 포트 5999 확인/수정
stream {
  upstream backend {
    server 127.0.0.1:5999;
  }
  server {
    listen 443 ssl;
    proxy_pass backend;
    proxy_protocol on;

    ssl_certificate      /etc/nginx/tls/nginx_ssl.crt;
    ssl_certificate_key  /etc/nginx/tls/nginx_ssl.key;
    ssl_password_file    /etc/nginx/tls/passwd;   # 패스워드 파일 없으면 entrypoint가 평문키 생성
    ssl_protocols        TLSv1.2;
    ssl_ciphers          "ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_timeout  4h;
  }
}

http {
  server_tokens off;

  # 웹 Backoffice(→ 9093)
  server {
    listen 5996 ssl http2;
    location / {
      proxy_pass http://127.0.0.1:9093;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-For $remote_addr;
      add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
      add_header Cache-Control "no-cache,no-store,must-revalidate";
    }
    ssl_certificate      /etc/nginx/tls/nginx_ssl.crt;
    ssl_certificate_key  /etc/nginx/tls/nginx_ssl.key;
    ssl_password_file    /etc/nginx/tls/passwd;
    ssl_protocols        TLSv1.2;
    ssl_ciphers          "ECDHE-RSA-AES256-GCM-SHA384";

    location = /healthweb { return 200 'SUCCESS'; add_header Content-Type text/plain; }
  }

  # API(→ 9094)
  server {
    listen 5997 ssl http2;
    location / {
      proxy_pass http://127.0.0.1:9094;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    ssl_certificate      /etc/nginx/tls/nginx_ssl.crt;
    ssl_certificate_key  /etc/nginx/tls/nginx_ssl.key;
    ssl_password_file    /etc/nginx/tls/passwd;
    ssl_protocols        TLSv1.2;
    ssl_ciphers          "ECDHE-RSA-AES256-GCM-SHA384";
  }
}
